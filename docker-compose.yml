services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: analisiutentitelegram
      MYSQL_USER: ${DB_USER:-telegram_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_ID: ${API_ID:?Set API_ID in .env}
      API_HASH: ${API_HASH:?Set API_HASH in .env}
      DB_HOST: mysql
      DB_NAME: analisiutentitelegram
      DB_USER: ${DB_USER:-telegram_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      TELEGRAM_SESSION_NAME: session/${TELEGRAM_SESSION_NAME:-telegram_session}
      API_HOST: 0.0.0.0
      API_PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - telegram_session:/app/session
      - telegram_downloads:/app/downloads
      - backend_logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  telegram_session:
  telegram_downloads:
  backend_logs:
